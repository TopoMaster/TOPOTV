apply plugin: 'com.android.application'

def releaseSigning = [
    keystorePath: System.getenv('ANDROID_KEYSTORE_PATH'),
    keystorePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigning.values().every { it?.trim() }
def androidVersionCode = System.getenv('ANDROID_VERSION_CODE')

android {
    namespace = "tv.topo.topotv"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    defaultConfig {
        applicationId "tv.topo.topotv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!<dir>bergamot'   // el traductor de Windows (Android usa ML Kit)
        }
    }
    androidResources {
        noCompress 'apk'
    }
    // Dos ediciones con el mismo código y el mismo identificador (una tele que tenga la de móvil se pasa a la de TV al actualizar):
    //  - movil: teléfonos y tabletas  → TOPOTV-vX.Y.Z.apk
    //  - tv:    Android TV / Google TV → TOPOTV-TV-vX.Y.Z.apk (arranca en modo TV, para mando)
    flavorDimensions = ['edicion']
    productFlavors {
        movil {
            dimension 'edicion'
            resValue 'string', 'topotv_edition', 'movil'
        }
        tv {
            dimension 'edicion'
            resValue 'string', 'topotv_edition', 'tv'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigning.keystorePath)
                storePassword releaseSigning.keystorePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // solo móviles ARM (todos los reales): el traductor de ML Kit pesa ~15 MB por arquitectura
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('validateReleaseSigning') {
    doLast {
        def missing = releaseSigning.findAll { key, value -> !value?.trim() }.keySet()
        if (missing) {
            throw new GradleException("Falta configurar la firma de publicación. Variables requeridas: ${missing.join(', ')}")
        }
        if (!(androidVersionCode ==~ /^[1-9][0-9]*$/)) {
            throw new GradleException('Define ANDROID_VERSION_CODE como un entero positivo antes de compilar una release.')
        }
        if (!file(releaseSigning.keystorePath).isFile()) {
            throw new GradleException("No se encontró el keystore indicado por ANDROID_KEYSTORE_PATH.")
        }
    }
}

// con dos ediciones las tareas son preMovilReleaseBuild y preTvReleaseBuild
tasks.matching { it.name ==~ /pre[A-Za-z]*ReleaseBuild/ }.configureEach {
    dependsOn tasks.named('validateReleaseSigning')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.media3:media3-exoplayer:1.5.1'          // reproductor integrado
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-cast:1.5.1'                // Chromecast desde el reproductor integrado
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.mlkit:translate:17.0.3'                 // traducción en el móvil (Google, sin conexión, gratis)
    implementation 'com.google.mlkit:language-id:17.0.6'               // detectar el idioma del texto
    implementation 'com.wireguard.android:tunnel:1.0.20260102'   // túnel WARP integrado
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
