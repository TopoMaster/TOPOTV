apply plugin: 'com.android.application'

def releaseSigning = [
    keystorePath: System.getenv('ANDROID_KEYSTORE_PATH'),
    keystorePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigning.values().every { it?.trim() }
def androidVersionCode = System.getenv('ANDROID_VERSION_CODE')

android {
    namespace = "tv.topo.topotv"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
    defaultConfig {
        applicationId "tv.topo.topotv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    androidResources {
        noCompress 'apk'
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigning.keystorePath)
                storePassword releaseSigning.keystorePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('validateReleaseSigning') {
    doLast {
        def missing = releaseSigning.findAll { key, value -> !value?.trim() }.keySet()
        if (missing) {
            throw new GradleException("Falta configurar la firma de publicación. Variables requeridas: ${missing.join(', ')}")
        }
        if (!(androidVersionCode ==~ /^[1-9][0-9]*$/)) {
            throw new GradleException('Define ANDROID_VERSION_CODE como un entero positivo antes de compilar una release.')
        }
        if (!file(releaseSigning.keystorePath).isFile()) {
            throw new GradleException("No se encontró el keystore indicado por ANDROID_KEYSTORE_PATH.")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('validateReleaseSigning')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.wireguard.android:tunnel:1.0.20230706'   // túnel WARP integrado
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
